name: Menu tests

# The ImGui menu is a header-only UI layer, so it can be regression-tested on a
# plain hosted runner with nothing but a C++ compiler — no Android SDK, no NDK,
# no device. That keeps the UI's behaviour (release-commit rows, child panes,
# auto-save debounce, controls, rotation clamping) covered on every change.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  menu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Run headless ImGui suites
        run: sh tools/tests/run_tests.sh

  site-preview:
    # The browser preview under site/ mirrors the same shell; keep it honest by
    # checking it still serves and that its assets are present.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Serve the preview
        run: |
          node site/serve.mjs &
          # Poll with curl rather than pulling an extra npm dependency, so this
          # job cannot fail on a registry hiccup.
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:4173/; then
              echo "preview is up"
              exit 0
            fi
            sleep 1
          done
          echo "preview did not become ready" >&2
          exit 1

      - name: Check the preview assets
        run: |
          set -eu
          for path in / /index.html /style.css /app.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:4173$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "unexpected status for $path" >&2; exit 1; }
          done
          curl -s http://127.0.0.1:4173/ | grep -q "ETHNIR"
          ! curl -s http://127.0.0.1:4173/style.css | grep -qi "equinox"
          echo "preview OK"